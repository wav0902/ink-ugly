<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INK UGLY</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #f3eee3;
    }
    header {
      text-align: center;
      margin-bottom: 35px;
      font-family: Georgia, serif;
      font-size: 42px;
      letter-spacing: 3px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }
    .gallery img {
      display: block;
      width: 100%;
      height: auto;
    }
    @media (max-width: 700px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>INK UGLY</header>
  <main class="gallery">
    <img src="images/ugly1.png" alt="">
    <img src="images/ugly2.png" alt="">
  </main>
</body>
</html>
