
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INK UGLY</title>

  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #f3eee3;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
      font-family: 'Kaushan Script', cursive;
      font-size: 48px;
      letter-spacing: 1px;
      font-weight: 400;
    }

    .instagram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      color: #000;
      text-decoration: none;
    }

    .instagram svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .instagram:hover {
      opacity: 0.65;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 700px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <header>
    INK UGLY

    <a class="instagram"
       href="https://www.instagram.com/ink.02.09/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram Ink Ugly">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
      </svg>

      @ink.02.09
    </a>
  </header>

  <main class="gallery">
    <img src="images/ugly1.png" alt="">
    <img src="images/ugly2.png" alt="">
  </main>
</body>
</html>
